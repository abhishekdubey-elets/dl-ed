# Render Blueprint — Pathwise on Render (FREE tier) + Supabase.
#
# The database is EXTERNAL: a Supabase Postgres project (pgvector lives there,
# also free tier). Before applying this blueprint, create an Environment Group
# in the Render dashboard named `pathwise-secrets` holding the values that must
# never live in the repo:
#
#   DATABASE_URL          postgresql+asyncpg://postgres.<ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres?ssl=require
#   SECRET_KEY            openssl rand -hex 32
#   ANTHROPIC_API_KEY     (or OPENAI_API_KEY — see LLM_PROVIDER below)
#   OPENAI_API_KEY        semantic embeddings
#   YOUTUBE_API_KEY       catalogue discovery + health
#   FIRST_ADMIN_EMAIL     bootstrap admin
#   FIRST_ADMIN_PASSWORD  bootstrap admin
#
# Use Supabase's SESSION pooler (port 5432, IPv4) — not the transaction
# pooler on 6543, which breaks asyncpg's prepared statements.
#
# Free-tier notes (docs/DEPLOYMENT.md has the full list):
#   * free services spin down after ~15 min idle; the next request takes up to
#     a minute while the instance wakes — warm both URLs before a demo;
#   * cron jobs have NO free tier, so catalogue maintenance is run manually
#     (see docs/DEPLOYMENT.md §catalogue) instead of on a schedule;
#   * 512 MB RAM per service — the API deliberately serves with a single
#     uvicorn worker (the Dockerfile default).

services:
  # ------------------------------------------------------------------ API
  - type: web
    name: pathwise-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health/ready
    autoDeploy: true
    envVars:
      - fromGroup: pathwise-secrets
      # The Docker CMD serves on 8000; telling Render keeps its proxy aligned.
      - key: PORT
        value: "8000"
      - key: ENVIRONMENT
        value: production
      - key: LOG_FORMAT
        value: json
      - key: DEBUG
        value: "false"
      - key: LLM_PROVIDER
        value: claude
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: CATALOGUE_PROVIDER
        value: youtube
      # The frontend proxies /api/* server-side, so the browser never makes a
      # cross-origin call — this only covers direct API docs access.
      - key: CORS_ORIGINS
        sync: false

  # ------------------------------------------------------------- Frontend
  - type: web
    name: pathwise-frontend
    runtime: node
    rootDir: frontend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      # The public URL of pathwise-api, e.g. https://pathwise-api.onrender.com
      # (known after the API's first deploy — set it once in the dashboard).
      - key: BACKEND_URL
        sync: false
